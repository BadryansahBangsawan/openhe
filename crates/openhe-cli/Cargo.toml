[package]
name = "openhe-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "openhe"
path = "src/main.rs"

[dependencies]
openhe-device = { path = "../openhe-device" }
openhe-proto = { path = "../openhe-proto" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
