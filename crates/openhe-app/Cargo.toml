[package]
name = "openhe-app"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OpenHE desktop configurator for AULA WIN 68/60 HE MAX keyboards"

[[bin]]
name = "openhe-app"
path = "src/main.rs"

[dependencies]
openhe-device = { path = "../openhe-device" }
openhe-proto = { path = "../openhe-proto" }
# eframe 0.32 (picked while the MSRV was 1.85; the app and its tests are
# built against it). Default features only: glow renderer, no persistence,
# no web or network features. The only network access of the app is the
# updater below.
eframe = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
# Pengaturan page (Track F). Versions picked by the MSRV-aware resolver
# (CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback); none of them or
# their dependencies declares a rust-version above 1.88. The MSRV is 1.88 because rfd's Linux
# portal backend and kdotool (active-win-pos-rs on KDE) use 1.88 features.
# Native open/save dialogs for profile import/export.
rfd = "0.17.2"
# Launch at login (LaunchAgent on macOS, registry on Windows, XDG on Linux).
auto-launch = "0.6.0"
# Foreground app name for per-app profile switching.
active-win-pos-rs = "0.11.0"
# Single-instance guard: an advisory lock on a file in the config dir
# (flock / LockFileEx), released by the OS when the process ends, also after
# a crash. rust-version 1.75; only its default `sync` feature.
fs4 = "1.1.0"
# Updater (src/update/): the app's only network access, to check GitHub
# releases and download a signed update. No telemetry, nothing else.
# HTTPS client with rustls (ring) and the bundled Mozilla roots: pure Rust
# TLS, so Linux needs no OpenSSL. No gzip, no JSON feature (serde_json is
# used directly). rust-version 1.85.
ureq = { version = "3.1", default-features = false, features = ["rustls"] }
# Ed25519 signature of the update manifest (verify_strict); rust-version 1.81.
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
# SHA-256 of the downloaded asset; the same 0.10 line ed25519-dalek uses.
sha2 = "0.10"
# Release tags and the running version (vX.Y.Z), rust-version 1.68.
semver = "1"

[features]
# Hooks that put pages into demo states, for offscreen screenshots only.
preview = []

[build-dependencies]
# Embeds the Windows icon and version info (build.rs; does nothing on other
# targets). Without the default `toml` feature: no Cargo.toml metadata is
# read, and its only dependency is version_check.
winresource = { version = "0.1.34", default-features = false }

[dev-dependencies]
# Headless end-to-end UI tests (tests/e2e_*.rs): they drive the real app UI
# through its AccessKit tree, on a keyboard simulator. Same egui as eframe;
# rust-version 1.88. The `eframe` feature runs `eframe::App::update` (close
# handling) with a test frame.
# `wgpu` + `snapshot` only for tests/screenshots.rs (ignored by default):
# `Harness::render` to a PNG.
egui_kittest = { version = "0.32.3", features = ["eframe", "wgpu", "snapshot"] }
